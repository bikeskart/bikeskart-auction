name: Inspector API tests
on:
  push:
    branches: [feature/inspector-android]
  pull_request:
  workflow_dispatch:
jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/inspector-api.test.js
