name: BikesKartAuction
options:
  bundleIdPrefix: com.bikeskart
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  BikesKartAuction:
    type: application
    platform: iOS
    sources: [BikesKartAuction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bikeskart.auction.ios
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BikesKart Auction
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Take vehicle photos for your BikesKart inspection.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio when capturing a vehicle inspection video.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose vehicle photos and documents to upload.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  BikesKartAuction:
    build:
      targets:
        BikesKartAuction: all
    run:
      config: Debug
    archive:
      config: Release
