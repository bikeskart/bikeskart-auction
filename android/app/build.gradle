plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
 namespace 'com.bikeskart.auction'
 buildFeatures { buildConfig true }
 compileSdk 35
 defaultConfig { applicationId 'com.bikeskart.auction'; minSdk 23; targetSdk 35; versionCode 5; versionName '1.5' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs {
   release {
     if (System.getenv('BK_RELEASE_KEYSTORE')) {
       storeFile file(System.getenv('BK_RELEASE_KEYSTORE'))
       storePassword System.getenv('BK_KEYSTORE_PASSWORD')
       keyAlias System.getenv('BK_KEY_ALIAS')
       keyPassword System.getenv('BK_KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release { signingConfig signingConfigs.release; minifyEnabled false }
 }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
